name: "Build release"

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

# A tag can be pushed again after a failed build, and two runs of the same
# tag would both upload assets. Queue them instead of cancelling: a cancelled
# run can leave a half-written release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check that the tag matches the module version
        run: |
          version=$(./tools/mkdkmsconf.sh --version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "module version is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dwarves zstd \
            linux-headers-generic

      - name: Lower the ASLR entropy for the sanitizer tests
        run: |
          if [ -e /proc/sys/vm/mmap_rnd_bits ]; then
            sudo sysctl -w vm.mmap_rnd_bits=28
          fi

      - name: Run the host tests
        run: |
          make host-test
          make host-test-san

      - name: Run the static invariant checks
        run: bash tools/lint.sh

      - name: Select the newest generic header tree
        id: kernel
        run: |
          kdir=$(ls -d /usr/src/linux-headers-*-generic 2>/dev/null |
            sort -V | tail -1 || true)
          if [ -z "$kdir" ] || [ ! -f "$kdir/Makefile" ]; then
            echo "no kernel header tree found under /usr/src" >&2
            exit 1
          fi
          release=$(basename "$kdir" | sed 's/^linux-headers-//')
          if ! dpkg --compare-versions "$release" ge 6.1; then
            echo "kernel headers $release are older than Linux 6.1" >&2
            exit 1
          fi
          echo "kdir=$kdir" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build the DKMS tarball
        run: |
          make dkms-srcs-check dkms-tarball
          version=$(./tools/mkdkmsconf.sh --version)
          tar xOf dkms.tar.gz ./dkms_source_tree/dkms.conf > /tmp/dkms.conf
          grep -qx "PACKAGE_VERSION=\"$version\"" /tmp/dkms.conf
          mkdir -p build
          mv dkms.tar.gz "build/tbtun-${{ steps.kernel.outputs.release }}.dkms.tar.gz"

      - name: Build the module from the DKMS tree
        run: |
          rm -rf /tmp/dkms-check
          mkdir -p /tmp/dkms-check
          tar xzf "build/tbtun-${{ steps.kernel.outputs.release }}.dkms.tar.gz" \
            -C /tmp/dkms-check
          (cd /tmp/dkms-check/dkms_source_tree &&
            make KERNEL_DIR="${{ steps.kernel.outputs.kdir }}" all)
          ko=/tmp/dkms-check/dkms_source_tree/build/kernel/tbtun.ko
          test -s "$ko"
          cp "$ko" "build/tbtun-${{ steps.kernel.outputs.release }}.ko"

      - name: Generate hashes
        run: |
          cd build
          sha256sum ./* > hashes.txt
          cat hashes.txt

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
