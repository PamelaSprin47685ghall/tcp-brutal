name: "Build release"

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag matches the module version
        run: |
          version=$(./scripts/mkdkmsconf.sh | sed -n 's/^PACKAGE_VERSION="\(.*\)"$/\1/p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "module version is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dwarves zstd linux-headers-generic

      - name: Select the newest generic header tree
        id: kernel
        run: |
          kdir=$(ls -d /usr/src/linux-headers-*-generic 2>/dev/null | sort -V | tail -1)
          if [ -z "$kdir" ] || [ ! -f "$kdir/Makefile" ]; then
            echo "no kernel header tree found under /usr/src" >&2
            exit 1
          fi
          release=$(basename "$kdir" | sed 's/^linux-headers-//')
          echo "kdir=$kdir" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build the DKMS tarball
        run: |
          make dkms-tarball
          mkdir -p build
          mv dkms.tar.gz "build/tbtun-${{ steps.kernel.outputs.release }}.dkms.tar.gz"

      - name: Build the module
        run: |
          make KERNEL_DIR="${{ steps.kernel.outputs.kdir }}" all
          cp tbtun.ko "build/tbtun-${{ steps.kernel.outputs.release }}.ko"

      - name: Run the host grammar test
        run: make host-test

      - name: Generate hashes
        run: |
          cd build
          sha256sum ./* > hashes.txt
          cat hashes.txt

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: build/*
