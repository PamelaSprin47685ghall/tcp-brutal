# perf-versions.conf - module paths for the 0.3.3 same-link A/B.
#
# One line per version: <name> <near_ko> <far_ko>
#
# The script checks that the loaded /sys/module/tbtun/srcversion equals the
# srcversion of the .ko it just insmod'd. That identity gate is the only
# reliable version check: fix builds near a release keep the release's
# TBT_VERSION_PATCH and report the older version string.
#
# 0.3.0 and 0.3.1 must be staged (or built) on both hosts first. A tag-exact
# staging from the workstation:
#
#   for v in 0.3.0 0.3.1; do
#       git archive --format=tar "v$v" | gzip -9 >"/tmp/tbtun-$v.tar.gz"
#       for h in root@192.168.123.85 root@45.11.1.62; do
#           ssh "$h" "mkdir -p /root/tbtun-perf/$v && tar -xzf - -C /root/tbtun-perf/$v"
#       done <"/tmp/tbtun-$v.tar.gz"
#       # then on each host: make -C /lib/modules/$(uname -r)/build M=/root/tbtun-perf/$v modules -j2
#   done
#
# 0.3.2 uses the recorded release build directory.
#
# name  near_ko                                                far_ko
0.3.0   /root/tbtun-perf/0.3.0/tbtun.ko                        /root/tbtun-perf/0.3.0/tbtun.ko
0.3.1   /root/tbtun-perf/0.3.1/tbtun.ko                        /root/tbtun-perf/0.3.1/tbtun.ko
0.3.2   /root/tbtun-0.3.2-release-20261108T140023Z/tbtun.ko    /root/tbtun-0.3.2-release-20261108T140023Z/tbtun.ko
