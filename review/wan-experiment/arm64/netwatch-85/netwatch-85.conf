# /etc/tbtun-netwatch.conf - .85 hardware watchdog feeder.
# Read by systemd (EnvironmentFile) and then by tbtun-netwatch.py.
# Keep FEED_S * 3 below the hardware timeout (44 s). Do not try to change the
# timeout here: dw_wdt SETTIMEOUT is not used by this feeder.
WATCHDOG_DEV=/dev/watchdog0
WATCHDOG_PROBE_URL=http://192.168.123.254:80/
WATCHDOG_EXPECT_STATUS=100-499
WATCHDOG_FEED_S=5
WATCHDOG_PROBE_S=30
WATCHDOG_PROBE_TIMEOUT_S=5
WATCHDOG_CONNECT_TIMEOUT_S=3
WATCHDOG_FAIL_THRESHOLD=3
WATCHDOG_GRACE_S=600
WATCHDOG_HARD_TIMEOUT_S=44
WATCHDOG_HEALTHY_RESET_S=1800
WATCHDOG_RESET_BUDGET=5
WATCHDOG_RESET_WINDOW_S=1800
WATCHDOG_DRY_RUN=0
WATCHDOG_LOG=/var/log/tbtun-watchdog.log
WATCHDOG_STATE_DIR=/var/lib/tbtun-netwatch
